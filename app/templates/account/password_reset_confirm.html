<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau mot de passe - IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card p-4 shadow" style="max-width:450px; width:100%;border-radius:16px;">
        <div class="text-center mb-4">
            <i class="bi bi-lock-fill fs-1 text-primary"></i>
            <h4 class="fw-bold mt-2">Nouveau mot de passe</h4>
            <p class="text-muted small">Choisissez un mot de passe sécurisé.</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nouveau mot de passe</label>
                <input type="password" name="new_password1" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmer le mot de passe</label>
                <input type="password" name="new_password2" class="form-control" required>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger small">
                {% for field in form %}{% for error in field.errors %}{{ error }}<br>{% endfor %}{% endfor %}
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100 mt-2">
                Enregistrer le nouveau mot de passe
            </button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
