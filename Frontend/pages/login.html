
<!DOCTYPE html>
<html lang="en">

<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pages/styles.css' %}">  
  <title>Connexion-IFRI MENTOR LINK</title>
</head>

<body>
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
      <!-- Logo et titre -->
      <div class="text-center mt-5 mb-3">
        <h4 class="text-center">
          <a href="#" class="text-dark text-decoration-none fw-bold">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="blue" class="bi bi-mortarboard"
              viewBox="0 0 16 16">
              <path
                d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917zM8 8.46 1.758 5.965 8 3.052l6.242 2.913z" />
              <path
                d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466zm-.068 1.873.22-.748 3.496 1.311a.5.5 0 0 0 .352 0l3.496-1.311.22.748L8 12.46z" />
            </svg>
            IFRI MentorLink
          </a>
        </h4>
        <h2 class="text-center fw-bold">Bienvenue</h2>
        <p class="text-center">Connectez-vous pour continuer votre parcours de mentorat</p>
      </div>
      <div class="container d-flex justify-content-center align-items-center">
        <div class="card shadow-sm p-4" style="max-width: 490px; width: 100%; height: 400px;">

          <!-- Formulaire -->
          <form method="POST" action="{% url 'connexion' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Adresse Email</label>
              <input type="email" class="form-control" name="email" id="email" placeholder="votre.email@gmail.com"
                required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Mot de Passe</label>
              <input type="password" class="form-control" name="password" id="password"
                placeholder="Entrez votre mot de passe" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small" for="remember">Se souvenir de moi</label>
              </div>
              <a href="{% url 'password_reset' %}" class="small text-decoration-none fw-bold">Mot de passe oublié ?</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 btn-sm">Se Connecter</button>
          </form>

          <!-- Lien inscription -->
          <div class="text-center mt-3">
            <p class="small mb-0">Vous n’avez pas de compte ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
          </div>

        </div>
      </div>
    </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
