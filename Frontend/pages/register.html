
<!DOCTYPE html>
<html lang="fr">

<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFRI MentorLink - Créer un Compte</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'pages/styles.css' %}">
</head>

<body>
  <!-- Logo + Titre -->
  <div class="text-center mb-3">
    <h3 class="fw-bold mt-2"> <a href="#" class="text-dark text-decoration-none">
        <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
        IFRI MentorLink
      </a></h3>
    <h5 class="mt-2 fw-bold">Créez Votre Compte</h5>
    <p class="text-muted">Rejoignez la communauté de mentorat IFRI</p>
  </div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="max-width: 680px; width: 100%;height:630px;">
      <!-- Formulaire -->
      <form method="POST" action="{% url 'inscription' %}">
        {% csrf_token %}
        <div class="two">
          <div class="mb-3" style="width: 300px;">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" name="prenom" class="form-control" id="prenom" placeholder="Jean" required>
          </div>
          <div class="mb-3" style="width: 300px;">
            <label for="nom"  class="form-label">Nom</label>
            <input type="text" name="nom" class="form-control" id="nom" placeholder="HOUNSOU" required>
          </div>
        </div>


        <div class="mb-3">
          <label for="email"  class="form-label">Adresse Email</label>
          <input type="email" name="email" class="form-control" id="email" placeholder="votre.email@gmail.com" required>
        </div>

        <div class="mb-3">

          <label for="telephone"  class="form-label">

            Numéro de téléphone

          </label>

          <input type="tel" name="telephone" class="form-control" id="telephone" placeholder="+229 01 90 00 00 00" required>

        </div>

        <!-- Choix spécialité -->
        <div class="mb-3">
          <label for="filiere"   class="form-label">Filière</label>
          <select class="form-select" name="filiere" id="filiere" required>
            <option selected disabled>Sélectionnez votre filière</option>
            <option>IA</option>
            <option>IM</option>
            <option>GL</option>
            <option>SE&IoT</option>
            <option>SI</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="niveau"   class="form-label">Niveau</label>
          <select class="form-select" name="niveau" id="niveau" required>
            <option selected disabled>Sélectionnez votre niveau</option>
            <option>L1</option>
            <option>L2</option>
            <option>L3</option>
            
          </select>
        </div>
        <div class="mb-3">
         <label for="bio" class="form-label">Bio <span class="text-muted small">(facultatif)</span></label>
         <textarea name="bio" class="form-control" id="bio" rows="3" 
          placeholder="Parlez-nous de vous..."></textarea>
       </div>

      <div class="mb-3">
        <label for="centre_interet" class="form-label">Centres d'intérêt <span class="text-muted small">(facultatif)</span></label>
        <textarea name="centre_interet" class="form-control" id="centre_interet" rows="3" 
          placeholder="Ex: Intelligence Artificielle, Python, Football..."></textarea>
      </div>
        <!-- Champ mot de passe -->
        <div class="three">
          <div class="mb-3" style="width: 300px;">

            <label for="password"  class="form-label">Mot de Passe</label>
            <input type="password" name="password1" class="form-control" id="password" placeholder="Créer un mot de passe" required>
          </div>

          <div class="mb-3" style="width: 300px;">
            <label for="Password2"  class="form-label">Confirmer le Mot de Passe</label>
            <input type="password" name="password2" class="form-control" id="confirmPassword" placeholder="Confirmer le mot de passe"
              required>
          </div>

        </div>

        <!-- Choix rôle -->
        <!-- <div class="mb-3">
          <label class="form-label">Je veux :</label>

           Option Trouver un Mentor 
          <div class="option-card">
            <input class="form-check-input" type="radio" name="role" id="mentoré" required>
            <label class="form-check-label fw-bold" for="mentoré">Trouver un Mentor</label>
            <p class="small text-muted mb-0 ms-4" font-size="14px";font-family="Arial">
              Obtenir des conseils et du soutien d'étudiants expérimentés.
            </p>
          </div>

           Option Devenir Mentor 
          <div class="option-card">
            <input class="form-check-input" type="radio" name="role" id="mentor" required>
            <label class="form-check-label fw-bold" for="mentor">Devenir Mentor</label>
            <p class="small text-muted mb-0 ms-4">
              Partagez vos connaissances et aidez les autres à réussir.
            </p>
          </div>
        </div> -->


        <!-- Conditions -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="conditions" required>
          <label class="form-check-label small" for="conditions">
            J’accepte les <a href="#">Conditions d’Utilisation</a> et la <a href="#">Politique de Confidentialité</a>
          </label>
        </div>

        <!-- Bouton Créer un compte-->
        <button type="submit" class="btn btn-primary w-100">Créer un Compte</button>
      </form>

      <!-- Lien connexion -->
      <div class="text-center mt-3">
        <p class="small mb-0">Vous avez déjà un compte ? <a href="{% url 'connexion' %}">Se Connecter</a></p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
