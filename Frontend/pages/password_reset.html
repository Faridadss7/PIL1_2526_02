<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/pages/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card p-4 shadow" style="max-width:450px; width:100%">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
            <h4 class="fw-bold mt-2">Mot de passe oublié ?</h4>
            <p class="text-muted">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Adresse email</label>
                <input type="email" name="email" class="form-control" placeholder="votre@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-send me-2"></i>Envoyer le lien
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'connexion' %}">← Retour à la connexion</a>
        </div>
    </div>
</body>
</html>
